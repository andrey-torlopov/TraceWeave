    "/api/v1/session/login": {
      "post": {
        "operationId": "login",
        "summary": "login",
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uri",
              "pattern": "^[^\\u0000]*$"
            }
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 128,
              "minLength": 43,
              "pattern": "^[^\\u0000]*$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionAuthenticated"
                },
                "example": {
                  "authenticated": true,
                  "user": {
                    "id": "30000000-0000-4000-8000-000000000001",
                    "displayName": "a",
                    "email": "owner@example.test",
                    "emailVerified": true
                  },
                  "csrfToken": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "expiresAt": "2026-10-08T12:00:00.000Z"
